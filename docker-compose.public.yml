# Публичный HTTPS (Let's Encrypt через Caddy).
services:
  caddy:
    image: caddy:2.9-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_APP_HOST: ${PUBLIC_APP_HOST:?set PUBLIC_APP_HOST}
      PUBLIC_PUSH_HOST: ${PUBLIC_PUSH_HOST:?set PUBLIC_PUSH_HOST}
    volumes:
      - ./caddy/Caddyfile.public:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - pushhive
    networks:
      - messenger
    restart: unless-stopped

  app:
    environment:
      PUBLIC_APP_URL: https://${PUBLIC_APP_HOST}
      PUSHHIVE_URL: http://pushhive:3000
      PUSHHIVE_PUBLIC_URL: https://${PUBLIC_PUSH_HOST}

volumes:
  caddy_data:
  caddy_config:
